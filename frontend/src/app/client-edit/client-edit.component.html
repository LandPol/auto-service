<div class="main-container">
  <h2>Edit Client</h2>

  @if (errorMessage) {
    <div class="error-banner">
      <b>Error:</b> {{errorMessage}}
    </div>
  }
  <div class="edit-form">
    <div class="form-group">
      <label for="name">Client name:</label>
      <input
        id="name"
        type="text"
        [(ngModel)]="client.name"
        placeholder="Client name"
        class="client-input"
      >
    </div>

    <div class="form-group">
      <label for="age">Client age:</label>
      <input
        id="age"
        type="number"
        [(ngModel)]="client.age"
        placeholder="Client age"
        class="client-input"
      >
    </div>

    <div class="button-group">
      <button (click)="onSave()" class="save-button">Save</button>
      <button (click)="onCancel()" class="cancel-button">Cancel</button>
    </div>
  </div>
</div>
