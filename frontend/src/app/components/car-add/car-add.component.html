<div class="main-container">
  <h2>Add New Car </h2>

  @if (errorMessage) {
    <div class="error-banner">
      <b>Error:</b> {{errorMessage}}
    </div>
  }

  <div class="edit-form">
    <div class="form-group">
      <label for="model">Car model:</label>
      <input
        id="model"
        type="text"
        [(ngModel)]="car.model"
        placeholder="Enter car model"
        class="car-input"
      >
    </div>

    <div class="form-group">
      <label for="type">Car type:</label>
      <input
        id="type"
        type="text"
        [(ngModel)]="car.type"
        placeholder="Enter car type"
        class="car-input"
      >
    </div>

    <div class="form-group">
      <label for="production-year">Car production year:</label>
      <input
        id="production-year"
        type="number"
        [(ngModel)]="car.productionYear"
        placeholder="Enter production year"
        class="car-input"
      >
    </div>

    <div class="button-group">
      <button (click)="onSave()" class="save-button">Add Car</button>
      <button (click)="onCancel()" class="cancel-button">Cancel</button>
    </div>
  </div>
</div>
