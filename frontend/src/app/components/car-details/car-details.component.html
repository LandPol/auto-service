<div class="main-container">
  <h2>Car Details</h2>

  @if (errorMessage) {
    <div class="error-banner">
      <b>Error:</b> {{errorMessage}}
    </div>
  }

  @if (car) {
    <div class="details-card">
      <div class="detail-row">
        <span class="label">ID:</span>
        <span class="value">{{ car.id }}</span>
      </div>

      <div class="detail-row">
        <span class="label">Model:</span>
        <span class="value">{{ car.model }}</span>
      </div>

      <div class="detail-row">
        <span class="label">Type:</span>
        <span class="value">{{ car.type }}</span>
      </div>

      <div class="detail-row">
        <span class="label">Production Year:</span>
        <span class="value">{{ car.productionYear }}</span>
      </div>

      <div class="detail-row">
        <span class="label">Owner ID:</span>
        <span class="value">{{ car.clientId }}</span>
      </div>
    </div>
  }

  <div class="button-group">
    <button (click)="onBack()" class="back-button">Back</button>
    @if (car) {
      <button [routerLink]="['/clients', clientId, 'cars', car.id, 'edit']" class="edit-button">Edit</button>
    }
  </div>
</div>
